name: Programação Duke Haus

on:
  push:
    branches: [main]
  schedule:
    - cron: '5,35 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: duke-haus-pages
  cancel-in-progress: false

jobs:
  programacao:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Baixar os arquivos do site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sincronizar programação da Blipy
        run: python3 scripts/sync_blipy.py
      - name: Preparar arquivos públicos
        run: |
          mkdir -p _site/data
          cp index.html CNAME _site/
          cp -R assets _site/
          cp data/events.json _site/data/
      - name: Enviar artefato do site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  publicar:
    needs: programacao
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
